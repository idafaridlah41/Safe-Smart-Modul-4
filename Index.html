        // State Management
        let currentSlide = 0;

        // DOM Elements
        const slideContainer = document.getElementById('slide-container');
        const slideCounter = document.getElementById('slide-counter');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const overviewModal = document.getElementById('overview-modal');
        const overviewGrid = document.getElementById('overview-grid');

        // Render Current Slide
        function renderSlide() {
            const slide = slidesData[currentSlide];
            
            slideContainer.innerHTML = `
                <div class="space-y-6 slide-transition">
                    <!-- Category Badge & Header -->
                    <div class="border-b border-slate-800/80 pb-4">
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="px-2.5 py-0.5 rounded text-[11px] font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30 uppercase tracking-wider">
                                ${slide.category}
                            </span>
                            <span class="text-xs text-slate-500">• Slide ${currentSlide + 1} dari ${slidesData.length}</span>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">${slide.title}</h2>
                        <p class="text-xs sm:text-sm text-purple-300 font-medium mt-1">${slide.subtitle}</p>
                    </div>

                    <!-- Slide Main Body -->
                    <div class="py-2">
                        ${slide.content}
                    </div>
                </div>
            `;

            // Update Controls & Counters
            slideCounter.textContent = `${currentSlide + 1} / ${slidesData.length}`;
            progressBar.style.width = `${((currentSlide + 1) / slidesData.length) * 100}%`;

            // Button Disable States
            prevBtn.disabled = currentSlide === 0;
            if (currentSlide === slidesData.length - 1) {
                nextBtn.innerHTML = `<span>Selesai</span> <i class="fa-solid fa-check ml-1"></i>`;
            } else {
                nextBtn.innerHTML = `<span>Berikutnya</span> <i class="fa-solid fa-chevron-right ml-1"></i>`;
            }

            // Scroll Slide content to top
            slideContainer.scrollTop = 0;
        }

        // Navigation Functions
        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentSlide = index;
            renderSlide();
            if (!overviewModal.classList.contains('hidden')) {
                toggleOverview();
            }
        }

        // Populate Overview Grid
        function populateOverview() {
            overviewGrid.innerHTML = '';
            slidesData.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border text-left cursor-pointer transition-all duration-200 ${
                    idx === currentSlide 
                    ? 'bg-purple-950/80 border-purple-500 ring-2 ring-purple-500/50' 
                    : 'bg-slate-900 border-slate-800 hover:border-slate-700 hover:bg-slate-850'
                }`;
                card.onclick = () => goToSlide(idx);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${idx === currentSlide ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-400'}">
                            Slide ${idx + 1}
                        </span>
                        <span class="text-[10px] text-purple-300 font-semibold">${slide.category}</span>
                    </div>
                    <h4 class="text-xs font-bold text-slate-200 line-clamp-1">${slide.title}</h4>
                    <p class="text-[11px] text-slate-400 line-clamp-2 mt-1">${slide.subtitle}</p>
                `;
                overviewGrid.appendChild(card);
            });
        }

        function toggleOverview() {
            if (overviewModal.classList.contains('hidden')) {
                populateOverview();
                overviewModal.classList.remove('hidden');
            } else {
                overviewModal.classList.add('hidden');
            }
        }

        // Toggle Fullscreen
        function toggleFullscreen() {
            const icon = document.getElementById('fullscreen-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting fullscreen: ${err.message}`);
                });
                icon.className = "fa-solid fa-compress text-purple-400";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.className = "fa-solid fa-expand text-purple-400";
                }
            }
        }

        // Keyboard Shortcuts Handler
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'Escape') {
                if (!overviewModal.classList.contains('hidden')) {
                    toggleOverview();
                }
            }
        });

        // Initialize First Slide
        renderSlide();
    </script>
